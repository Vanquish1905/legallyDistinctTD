<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegallyDistinctTD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
      body { font-family: 'Rubik', system-ui, sans-serif; }
      #game { width: 100vw; height: 100vh; }
      #game canvas { display: block; }
      #boot-error { display: none; position: fixed; inset: 0; padding: 24px; color: #e2e8f0; font: 16px/1.5 system-ui, sans-serif; background: #0d1117; white-space: pre-wrap; }
    </style>
    <script>
      // Shows load/runtime errors as text instead of a blank page (helps when reporting bugs from phones).
      window.addEventListener('error', function (e) {
        var box = document.getElementById('boot-error');
        if (!box) return;
        box.style.display = 'block';
        box.textContent = 'LegallyDistinctTD hit an error while starting:\n\n' + (e.message || (e.target && e.target.src) || 'unknown error');
      }, true);
    </script>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
